name: henachel-points-global

on:
  push:
    branches: [run-points-live-2026-09-29, goal-model-live-2026-09-29, main]
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date de run Europe/Paris (YYYY-MM-DD). Vide = aujourd'hui Paris"
        required: false
        type: string
      hub_url:
        description: "URL hub Unibet NHL"
        required: false
        type: string
        default: "https://www.unibet.fr/paris-hockey-sur-glace/etats-unis/nhl"
      headless:
        description: "Lancer Playwright en headless"
        required: false
        type: boolean
        default: true
      discovery_max_matches:
        description: "Nombre max de matchs à cliquer côté hub"
        required: false
        type: string
        default: "13"
      min_rows_per_event:
        description: "Seuil minimal de lignes 1+ par match pour l'acceptance POINTS"
        required: false
        type: string
        default: "7"
      publish_to_sheet:
        description: "Publier vers Google Sheet"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 10 * * *"
      timezone: "Europe/Paris"

concurrency:
  group: henachel-daily-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TZ: Europe/Paris
  PYTHONUNBUFFERED: "1"

jobs:
  scrape_markets:
    name: Scraper Unibet POINTS + BUTEURS
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      publish_to_sheet: ${{ steps.resolve.outputs.publish_to_sheet }}

    steps:
      - name: Resolve runtime config
        id: resolve
        shell: bash
        run: |
          INPUT_RUN_DATE="${{ github.event.inputs.run_date }}"
          INPUT_HUB_URL="${{ github.event.inputs.hub_url }}"
          INPUT_HEADLESS="${{ github.event.inputs.headless }}"
          INPUT_DISCOVERY_MAX_MATCHES="${{ github.event.inputs.discovery_max_matches }}"
          INPUT_MIN_ROWS_PER_EVENT="${{ github.event.inputs.min_rows_per_event }}"
          INPUT_PUBLISH_TO_SHEET="${{ github.event.inputs.publish_to_sheet }}"

          RUN_DATE="${INPUT_RUN_DATE:-$(TZ=Europe/Paris date +%F)}"
          HUB_URL="${INPUT_HUB_URL:-https://www.unibet.fr/paris-hockey-sur-glace/etats-unis/nhl}"
          HEADLESS="${INPUT_HEADLESS:-true}"
          DISCOVERY_MAX_MATCHES="${INPUT_DISCOVERY_MAX_MATCHES:-13}"
          MIN_ROWS_PER_EVENT="${INPUT_MIN_ROWS_PER_EVENT:-7}"
          PUBLISH_TO_SHEET="${INPUT_PUBLISH_TO_SHEET:-true}"

          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "publish_to_sheet=$PUBLISH_TO_SHEET" >> "$GITHUB_OUTPUT"
          {
            echo "RUN_DATE=$RUN_DATE"
            echo "HUB_URL=$HUB_URL"
            echo "HEADLESS=$HEADLESS"
            echo "DISCOVERY_MAX_MATCHES=$DISCOVERY_MAX_MATCHES"
            echo "MIN_ROWS_PER_EVENT=$MIN_ROWS_PER_EVENT"
            echo "PUBLISH_TO_SHEET=$PUBLISH_TO_SHEET"
          } >> "$GITHUB_ENV"

      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          repository: mazalazop/nhl-unibet-odds-scraper
          path: scraper_repo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper dependencies
        working-directory: scraper_repo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Discover NHL event URLs
        working-directory: scraper_repo
        env:
          UNIBET_HUB_URL: ${{ env.HUB_URL }}
          PW_HEADLESS: ${{ env.HEADLESS }}
          DISCOVERY_MAX_MATCHES: ${{ env.DISCOVERY_MAX_MATCHES }}
        run: python scrapers/unibet_points_discover_event_urls.py

      - name: Export discovered event URLs
        working-directory: scraper_repo
        shell: bash
        run: |
          LATEST_DISCOVERY_DIR=$(ls -td artifacts/unibet_points_discover_event_urls/* | head -n 1)
          export DISCOVERY_JSON_PATH="$LATEST_DISCOVERY_DIR/discovered_event_urls.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ["DISCOVERY_JSON_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          urls = payload.get("event_urls", [])
          if not urls:
              raise SystemExit("Aucune event URL NHL découverte depuis le hub Unibet.")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as h:
              h.write(f"UNIBET_EVENT_URLS={','.join(urls)}\n")
          print(f"URLs découvertes : {len(urls)}")
          PY

      - name: Scrape POINTS
        working-directory: scraper_repo
        env:
          UNIBET_EVENT_URLS: ${{ env.UNIBET_EVENT_URLS }}
          PW_HEADLESS: ${{ env.HEADLESS }}
        run: python scrapers/unibet_event_points_batch_runner.py

      - name: Normalize POINTS
        working-directory: scraper_repo
        env:
          MIN_ROWS_PER_EVENT: ${{ env.MIN_ROWS_PER_EVENT }}
        shell: bash
        run: |
          BATCH_DIR=$(ls -td artifacts/unibet_event_points_batch_runner/* | head -n 1)
          export BATCH_SUMMARY_PATH="$BATCH_DIR/batch_summary.json"
          python scrapers/unibet_event_points_acceptance_report.py
          export ACCEPTANCE_REPORT_PATH="$BATCH_DIR/acceptance_report.json"
          python scrapers/unibet_event_points_normalize_accepted.py

      - name: Scrape BUTEURS
        working-directory: scraper_repo
        env:
          UNIBET_EVENT_URLS: ${{ env.UNIBET_EVENT_URLS }}
          PW_HEADLESS: ${{ env.HEADLESS }}
        continue-on-error: true
        run: python scrapers/unibet_event_goals_batch_runner.py

      - name: Normalize BUTEURS
        working-directory: scraper_repo
        if: always()
        shell: bash
        run: |
          BATCH_DIR=$(ls -td artifacts/unibet_event_goals_batch_runner/* 2>/dev/null | head -n 1 || true)
          if [ -n "$BATCH_DIR" ] && [ -f "$BATCH_DIR/batch_summary.json" ]; then
            export BATCH_SUMMARY_PATH="$BATCH_DIR/batch_summary.json"
            python scrapers/unibet_event_goals_acceptance_report.py || true
            if [ -f "$BATCH_DIR/acceptance_report.json" ]; then
              export ACCEPTANCE_REPORT_PATH="$BATCH_DIR/acceptance_report.json"
              python scrapers/unibet_event_goals_normalize_accepted.py || true
            fi
          fi

          mkdir -p export_bundle
          POINTS_DIR=$(ls -td artifacts/unibet_event_points_batch_runner/* | head -n 1)
          cp "$POINTS_DIR/normalized_points_odds.json" export_bundle/normalized_points_odds.json
          cp "$POINTS_DIR/acceptance_report.json" export_bundle/points_acceptance_report.json
          cp "$POINTS_DIR/batch_summary.json" export_bundle/points_batch_summary.json

          GOALS_JSON=$(find artifacts/unibet_event_goals_batch_runner -type f -name normalized_goals_odds.json | sort | tail -n 1 || true)
          if [ -n "$GOALS_JSON" ]; then
            cp "$GOALS_JSON" export_bundle/normalized_goals_odds.json
          else
            printf '{"bookmaker":"unibet_fr","market_key":"player_to_score_including_ot","normalized_rows":[]}' > export_bundle/normalized_goals_odds.json
          fi

          DISCOVERY_DIR=$(ls -td artifacts/unibet_points_discover_event_urls/* | head -n 1)
          cp "$DISCOVERY_DIR/discovered_event_urls.json" export_bundle/discovered_event_urls.json

      - name: Upload market odds
        uses: actions/upload-artifact@v4
        with:
          name: henachel-market-odds-${{ env.RUN_DATE }}
          path: scraper_repo/export_bundle/
          retention-days: 7

  model_daily:
    name: Pipeline modèle quotidien
    needs: scrape_markets
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout model repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn requests urllib3 gspread google-auth google-auth-oauthlib google-auth-httplib2

      - name: Download market odds
        uses: actions/download-artifact@v4
        with:
          name: henachel-market-odds-${{ needs.scrape_markets.outputs.run_date }}
          path: _market_artifact

      - name: Place normalized market odds
        run: |
          mkdir -p outputs
          cp _market_artifact/normalized_points_odds.json outputs/normalized_points_odds.json
          cp _market_artifact/normalized_goals_odds.json outputs/normalized_goals_odds.json

      - name: Write Google credentials
        if: ${{ needs.scrape_markets.outputs.publish_to_sheet == 'true' }}
        run: |
          mkdir -p secrets
          cat > secrets/henachel-service-account.json <<'JSON'
          ${{ secrets.HENACHEL_GOOGLE_CREDENTIALS_JSON }}
          JSON

      - name: Restore latest validated state artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _state
          mkdir -p _state

          # Restore the newest non-expired historical state from prior successful runs.
          STATE_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mazalazop/nhl-value-betting-model/actions/artifacts?name=henachel-state&per_page=30" \
            | python -c 'import json,sys; d=json.load(sys.stdin); a=[x for x in d.get("artifacts",[]) if not x.get("expired") and x.get("workflow_run",{}).get("head_branch")=="goal-model-live-2026-09-29"]; print(next((x["id"] for x in a), ""))')
          test -n "$STATE_ID" || { echo "No usable henachel-state artifact"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mazalazop/nhl-value-betting-model/actions/artifacts/$STATE_ID/zip" \
            -o _state/state.zip
          unzip -q _state/state.zip -d _state/unpacked

          RAW_DIR=$(find _state/unpacked -type d -path '*/raw' -print -quit)
          FINAL_DIR=$(find _state/unpacked -type d -path '*/final' -print -quit)
          if [ -z "$RAW_DIR" ] || [ -z "$FINAL_DIR" ]; then
            echo "Impossible de trouver la base historique dans l'artefact."
            find _state/unpacked -maxdepth 5 -type d | sort
            exit 1
          fi

          mkdir -p data/raw data/final
          cp -R "$RAW_DIR/." data/raw/
          cp -R "$FINAL_DIR/." data/final/
          echo "State restored from artifact $STATE_ID"
          ls -lh data/raw data/final

      - name: Refresh current season data
        run: python model/00d_refresh_current_season_incremental.py

      - name: Refresh power-play stats
        run: python model/00a_refresh_pp_stats.py

      - name: Refresh standings
        run: python model/00c_refresh_team_standings.py --extra-date "${{ needs.scrape_markets.outputs.run_date }}"

      - name: Build pre-match features
        run: python model/01_build_base_features.py

      - name: Train POINTS model
        run: python model/02_train_point_model.py

      - name: Calibrate POINTS model
        run: python model/03_calibrate_point_model.py

      - name: Predict POINTS
        run: python model/05_predict_upcoming_games.py --target-date "${{ needs.scrape_markets.outputs.run_date }}"

      - name: Train BUTEURS model
        run: python model/04_train_goal_model.py

      - name: Predict BUTEURS
        run: python model/05_predict_upcoming_goals.py --target-date "${{ needs.scrape_markets.outputs.run_date }}"

      - name: Match POINTS odds
        run: python model/06_match_model_to_unibet_odds.py --run-date "${{ needs.scrape_markets.outputs.run_date }}"

      - name: Build POINTS picks
        run: python model/07_build_daily_bets.py --run-date "${{ needs.scrape_markets.outputs.run_date }}" --max-picks 10 --min-odds 1.40

      - name: Match BUTEURS odds
        run: python model/06b_match_model_to_unibet_goal_odds.py --run-date "${{ needs.scrape_markets.outputs.run_date }}"

      - name: Build BUTEURS picks
        run: python model/07_build_daily_goal_bets.py --run-date "${{ needs.scrape_markets.outputs.run_date }}" --max-picks 10 --min-odds 1.40

      - name: Publish to Google Sheet
        if: ${{ needs.scrape_markets.outputs.publish_to_sheet == 'true' }}
        run: |
          python model/08_publish_to_google_sheet.py             --sheet-id "${{ secrets.HENACHEL_SHEET_ID }}"             --credentials-json "secrets/henachel-service-account.json"

      - name: Validate daily outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          date = "${{ needs.scrape_markets.outputs.run_date }}"
          point = pd.read_csv("outputs/07_daily_bets.csv")
          goal = pd.read_csv("outputs/07_daily_goal_bets.csv")
          assert len(point) <= 10, f"POINTS > 10: {len(point)}"
          assert len(goal) <= 10, f"BUTEURS > 10: {len(goal)}"
          if not point.empty:
              assert point["run_date"].astype(str).eq(date).all()
          if not goal.empty:
              assert goal["run_date"].astype(str).eq(date).all()
          assert Path("outputs/06_matching_summary.json").exists()
          assert Path("outputs/06b_goal_matching_summary.json").exists()
          print(f"VALIDATION OK: POINTS={len(point)} BUTEURS={len(goal)}")
          PY

      - name: Upload validated state
        uses: actions/upload-artifact@v4
        with:
          name: henachel-state
          path: |
            data/raw/
            data/final/
          retention-days: 30

      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henachel-model-outputs-${{ needs.scrape_markets.outputs.run_date }}
          path: |
            outputs/
            data/raw/
            data/final/
          retention-days: 7
