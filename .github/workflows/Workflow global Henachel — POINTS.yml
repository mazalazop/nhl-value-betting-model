name: henachel-points-global

on:
  push:
    branches: [astra/audit-remediation]
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date NHL gameDate (YYYY-MM-DD). Vide = aujourd'hui New York"
        required: false
        type: string
      bootstrap_history:
        description: "Initialiser un nouvel historique vide (jamais pour remplacer un historique existant)"
        type: boolean
        default: false
      publish_to_sheet:
        description: "Publier vers Google Sheet"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: henachel-points-history
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  TZ: Europe/Paris
  PYTHONUNBUFFERED: "1"

jobs:
  scrape_points:
    name: Resolve operational runtime
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      publish_to_sheet: ${{ steps.resolve.outputs.publish_to_sheet }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve runtime config
        id: resolve
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_PUBLISH_TO_SHEET: ${{ inputs.publish_to_sheet }}
        run: python3 scripts/resolve_runtime.py

  sheets_readonly:
    name: Validate Henachel read-only access
    if: github.ref == 'refs/heads/astra/audit-remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - run: python -m pip install -r requirements.lock
      - name: Test history schema migration offline
        run: python -m pytest tests/test_sheets_migration.py tests/test_sheets_environment.py tests/test_publication.py -q -W error
      - name: Simulate legacy history schema migration without writing
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.HENACHEL_GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.HENACHEL_SHEET_ID }}
        run: python scripts/migrate_history_sheet.py
      - name: Read metadata and headers only
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.HENACHEL_GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.HENACHEL_SHEET_ID }}
        run: python scripts/validate_sheets_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: henachel-sheets-readonly-${{ github.run_id }}
          path: |
            outputs/sheets_readonly_validation.json
            outputs/history_schema_migration.json

  model_points:
    name: Pipeline modèle POINTS
    needs: scrape_points
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_DATE: ${{ needs.scrape_points.outputs.run_date }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout model repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install model dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          python -m pytest -q -W error

      - name: Resolve model NHL date independently of scraper availability
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
        run: python scripts/resolve_runtime.py

      - name: Restore final boxscore cache
        uses: actions/cache@v4
        with:
          path: data/raw/boxscores
          key: nhl-boxscores-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: nhl-boxscores-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore canonical history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history || github.ref == 'refs/heads/astra/audit-remediation' }}
        run: |
          ARGS=()
          if [ "$BOOTSTRAP_HISTORY" = "true" ]; then ARGS+=(--bootstrap); fi
          python scripts/restore_history.py "${ARGS[@]}"

      - name: Refresh upstream sources
        env:
          OPERATIONAL_BRANCH: ${{ github.ref == 'refs/heads/astra/audit-remediation' }}
        run: |
          ARGS=()
          if [ "$OPERATIONAL_BRANCH" = "true" ]; then ARGS+=(--min-season 20242025 --skip-boxscore-supplement); fi
          python model/00_refresh_sources.py "${ARGS[@]}"

      - name: Refresh PP stats
        run: python model/00a_refresh_pp_stats.py

      - name: Build base match fusionnee
        run: python model/00b_build_base_match_fusionnee.py

      - name: Settle canonical bets after result refresh
        run: python model/09_settle_previous_bets.py --run-date "$RUN_DATE"

      - name: Refresh pregame standings
        run: python model/00c_refresh_team_standings.py

      - name: Build features
        run: python model/01_build_base_features.py

      - name: Predict upcoming games
        run: python model/05_predict_upcoming_games.py --target-date "$RUN_DATE"

      - name: Collect verified public Unibet POINT markets
        run: |
          python scripts/collect_unibet_structured.py
          cp outputs/structured_bookmaker/normalized_points_odds.json outputs/normalized_points_odds.json
          python scripts/validate_bookmaker_contract.py outputs/normalized_points_odds.json

      - name: Match model to Unibet odds
        run: python model/06_match_model_to_unibet_odds.py --run-date "$RUN_DATE"

      - name: Build daily bets
        run: python model/07_build_daily_bets.py --run-date "$RUN_DATE"

      - name: Publish to Google Sheet
        if: ${{ needs.scrape_points.outputs.publish_to_sheet == 'true' && github.ref != 'refs/heads/astra/audit-remediation' }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.HENACHEL_GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.HENACHEL_SHEET_ID }}
        shell: bash
        run: |
          python model/08_publish_to_google_sheet.py --sheet-id "$SHEET_ID" --credentials-env

      - name: Preserve canonical history even after publication failure
        if: ${{ always() && steps.history.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.history.outputs.artifact_name }}
          path: |
            outputs/history/master_daily_bets_history.csv
            outputs/history/settlement_revisions.csv
          if-no-files-found: error
          retention-days: 90

      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henachel-model-outputs-${{ needs.scrape_points.outputs.run_date }}
          path: |
            outputs/
            data/raw/*.csv
            data/final/
          retention-days: 7
