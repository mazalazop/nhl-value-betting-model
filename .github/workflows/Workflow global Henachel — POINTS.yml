name: henachel-points-global

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date NHL gameDate (YYYY-MM-DD). Vide = aujourd'hui New York"
        required: false
        type: string
      hub_url:
        description: "URL hub Unibet NHL"
        required: false
        type: string
        default: "https://www.unibet.fr/paris-hockey-sur-glace/etats-unis/nhl"
      headless:
        description: "Lancer Playwright en headless"
        required: false
        type: boolean
        default: true
      discovery_max_matches:
        description: "Nombre max de matchs à cliquer côté hub"
        required: false
        type: string
        default: "12"
      min_rows_per_event:
        description: "Seuil minimal de lignes 1+ par match pour l'acceptance report"
        required: false
        type: string
        default: "8"
      bootstrap_history:
        description: "Initialiser un nouvel historique vide (jamais pour remplacer un historique existant)"
        type: boolean
        default: false
      publish_to_sheet:
        description: "Publier vers Google Sheet"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * *"

concurrency:
  group: henachel-points-history
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  TZ: Europe/Paris
  PYTHONUNBUFFERED: "1"

jobs:
  scrape_points:
    name: Scraper Unibet POINTS
    runs-on: [self-hosted, macOS, X64, morgan-runner]
    timeout-minutes: 120
    outputs:
      run_date: ${{ steps.resolve.outputs.run_date }}
      publish_to_sheet: ${{ steps.resolve.outputs.publish_to_sheet }}

    steps:
      - name: Checkout pipeline controls
        uses: actions/checkout@v4
        with:
          path: control_repo
      - name: Resolve runtime config
        id: resolve
        shell: bash
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
          INPUT_HUB_URL: ${{ inputs.hub_url }}
          INPUT_HEADLESS: ${{ inputs.headless }}
          INPUT_DISCOVERY_MAX_MATCHES: ${{ inputs.discovery_max_matches }}
          INPUT_MIN_ROWS_PER_EVENT: ${{ inputs.min_rows_per_event }}
          INPUT_PUBLISH_TO_SHEET: ${{ inputs.publish_to_sheet }}
        run: |
          python3 control_repo/scripts/resolve_runtime.py
          echo "HENACHEL_RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          repository: mazalazop/nhl-unibet-odds-scraper
          path: scraper_repo
          token: ${{ secrets.SCRAPER_REPO_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install scraper dependencies
        working-directory: scraper_repo
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Discover event URLs from hub
        working-directory: scraper_repo
        env:
          UNIBET_HUB_URL: ${{ env.HUB_URL }}
          PW_HEADLESS: ${{ env.HEADLESS }}
          DISCOVERY_MAX_MATCHES: ${{ env.DISCOVERY_MAX_MATCHES }}
        run: |
          python scrapers/unibet_points_discover_event_urls.py

      - name: Export discovered event URLs
        working-directory: scraper_repo
        shell: bash
        run: |
          LATEST_DISCOVERY_DIR=$(python ../control_repo/scripts/latest_scraper_artifact.py artifacts/unibet_points_discover_event_urls)
          export DISCOVERY_JSON_PATH="$LATEST_DISCOVERY_DIR/discovered_event_urls.json"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["DISCOVERY_JSON_PATH"])
          payload = json.loads(path.read_text(encoding="utf-8"))
          urls = payload.get("event_urls", [])
          if any("\n" in url or "\r" in url for url in urls):
              raise ValueError("Invalid event URL")

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as handle:
              handle.write(f"HAS_EVENTS={str(bool(urls)).lower()}\n")
              handle.write(f"DISCOVERY_JSON_PATH={path}\n")
              handle.write(f"UNIBET_EVENT_URLS={','.join(urls)}\n")

          print(f"URLs découvertes : {len(urls)}")
          PY

      - name: Run points batch
        if: env.HAS_EVENTS == 'true'
        working-directory: scraper_repo
        env:
          UNIBET_EVENT_URLS: ${{ env.UNIBET_EVENT_URLS }}
          PW_HEADLESS: ${{ env.HEADLESS }}
        run: |
          python scrapers/unibet_event_points_batch_runner.py

      - name: Build acceptance report
        if: env.HAS_EVENTS == 'true'
        working-directory: scraper_repo
        env:
          MIN_ROWS_PER_EVENT: ${{ env.MIN_ROWS_PER_EVENT }}
        shell: bash
        run: |
          LATEST_BATCH_DIR=$(python ../control_repo/scripts/latest_scraper_artifact.py artifacts/unibet_event_points_batch_runner)
          export BATCH_SUMMARY_PATH="$LATEST_BATCH_DIR/batch_summary.json"
          python scrapers/unibet_event_points_acceptance_report.py

      - name: Build normalized points json
        if: env.HAS_EVENTS == 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          LATEST_BATCH_DIR=$(python ../control_repo/scripts/latest_scraper_artifact.py artifacts/unibet_event_points_batch_runner)
          export ACCEPTANCE_REPORT_PATH="$LATEST_BATCH_DIR/acceptance_report.json"
          python scrapers/unibet_event_points_normalize_accepted.py

      - name: Prepare artifact bundle for model job
        if: env.HAS_EVENTS == 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          mkdir -p export_bundle
          LATEST_DISCOVERY_DIR=$(python ../control_repo/scripts/latest_scraper_artifact.py artifacts/unibet_points_discover_event_urls)
          LATEST_BATCH_DIR=$(python ../control_repo/scripts/latest_scraper_artifact.py artifacts/unibet_event_points_batch_runner)

          cp "$LATEST_BATCH_DIR/normalized_points_odds.json" export_bundle/normalized_points_odds.json
          cp "$LATEST_BATCH_DIR/acceptance_report.json" export_bundle/acceptance_report.json
          cp "$LATEST_BATCH_DIR/batch_summary.json" export_bundle/batch_summary.json
          cp "$LATEST_DISCOVERY_DIR/discovered_event_urls.json" export_bundle/discovered_event_urls.json

      - name: Export empty market day
        if: env.HAS_EVENTS == 'false'
        working-directory: scraper_repo
        run: |
          mkdir -p export_bundle
          python - <<'PYEMPTY'
          import json
          from pathlib import Path
          Path('export_bundle/normalized_points_odds.json').write_text(json.dumps(dict(bookmaker='unibet',market='player_points',stat='points',threshold=1,outcome_label='1+',rows=[])))
          PYEMPTY

      - name: Upload scraper outputs for model job
        uses: actions/upload-artifact@v4
        with:
          name: henachel-points-odds-${{ env.RUN_DATE }}
          path: scraper_repo/export_bundle/
          retention-days: 7

  model_points:
    name: Pipeline modèle POINTS
    needs: scrape_points
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUN_DATE: ${{ needs.scrape_points.outputs.run_date }}
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"

    steps:
      - name: Checkout model repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Install model dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          python -m pytest -q

      - name: Resolve model NHL date independently of scraper availability
        env:
          INPUT_RUN_DATE: ${{ inputs.run_date }}
        run: python scripts/resolve_runtime.py

      - name: Restore final boxscore cache
        uses: actions/cache@v4
        with:
          path: data/raw/boxscores
          key: nhl-boxscores-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: nhl-boxscores-v1-${{ runner.os }}-${{ github.ref_name }}-

      - name: Restore canonical history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_HISTORY: ${{ inputs.bootstrap_history }}
        run: |
          ARGS=()
          if [ "$BOOTSTRAP_HISTORY" = "true" ]; then ARGS+=(--bootstrap); fi
          python scripts/restore_history.py "${ARGS[@]}"

      - name: Refresh upstream sources
        run: python model/00_refresh_sources.py

      - name: Refresh PP stats
        run: python model/00a_refresh_pp_stats.py

      - name: Build base match fusionnee
        run: python model/00b_build_base_match_fusionnee.py

      - name: Settle canonical bets after result refresh
        run: python model/09_settle_previous_bets.py --run-date "$RUN_DATE"

      - name: Refresh pregame standings
        run: python model/00c_refresh_team_standings.py

      - name: Build features
        run: python model/01_build_base_features.py

      - name: Predict upcoming games
        run: python model/05_predict_upcoming_games.py --target-date "$RUN_DATE"

      - name: Download scraper artifact
        if: needs.scrape_points.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: henachel-points-odds-${{ needs.scrape_points.outputs.run_date }}
          path: _scraper_artifact

      - name: Place normalized_points_odds.json where script 06 expects it
        if: needs.scrape_points.result == 'success'
        shell: bash
        run: |
          mkdir -p outputs
          cp _scraper_artifact/normalized_points_odds.json outputs/normalized_points_odds.json
          ls -la outputs

      - name: Record unavailable bookmaker source
        if: needs.scrape_points.result != 'success'
        run: |
          python - <<'PYEMPTY'
          import json
          from pathlib import Path
          Path('outputs/normalized_points_odds.json').write_text(json.dumps(dict(status='scraper_unavailable',bookmaker='unibet',market='player_points',stat='points',threshold=1,outcome_label='1+',rows=[])))
          PYEMPTY

      - name: Match model to Unibet odds
        run: python model/06_match_model_to_unibet_odds.py --run-date "$RUN_DATE"

      - name: Build daily bets
        run: python model/07_build_daily_bets.py --run-date "$RUN_DATE"

      - name: Publish to Google Sheet
        if: ${{ needs.scrape_points.outputs.publish_to_sheet == 'true' }}
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.HENACHEL_GOOGLE_CREDENTIALS_JSON }}
          SHEET_ID: ${{ secrets.HENACHEL_SHEET_ID }}
        shell: bash
        run: |
          CREDENTIALS_PATH=$(mktemp "$RUNNER_TEMP/henachel-credentials.XXXXXX")
          trap 'rm -f "$CREDENTIALS_PATH"' EXIT
          chmod 600 "$CREDENTIALS_PATH"
          printf '%s' "$GOOGLE_CREDENTIALS" > "$CREDENTIALS_PATH"
          unset GOOGLE_CREDENTIALS
          python model/08_publish_to_google_sheet.py --sheet-id "$SHEET_ID" --credentials-json "$CREDENTIALS_PATH"

      - name: Preserve canonical history even after publication failure
        if: ${{ always() && steps.history.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.history.outputs.artifact_name }}
          path: |
            outputs/history/master_daily_bets_history.csv
            outputs/history/settlement_revisions.csv
          if-no-files-found: error
          retention-days: 90

      - name: Upload model outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henachel-model-outputs-${{ needs.scrape_points.outputs.run_date }}
          path: |
            outputs/
            data/raw/*.csv
            data/final/
          retention-days: 7
