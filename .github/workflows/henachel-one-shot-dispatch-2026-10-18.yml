name: Henachel one-shot launch 2026-10-18
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/henachel-one-shot-dispatch-2026-10-18.yml'
permissions:
  actions: write
  contents: read
jobs:
  dispatch-production-models:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch POINT plus GOAL research for October 18
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST             repos/${{ github.repository }}/actions/workflows/249900633/dispatches             -f ref=main             -f 'inputs[run_date]=2026-10-18'             -f 'inputs[goal_research_enabled]=true'             -f 'inputs[context_only]=false'             -f 'inputs[publish_to_sheet]=false'
