name: HENACHEL postgame quality audit (research)
on:
  push:
    branches:
      - research/postgame-quality-20261018
    paths:
      - scripts/postgame_pick_diagnostics.py
      - scripts/postgame_import_ledger.py
      - scripts/postgame_restore_production_ledger.py
      - tests/test_postgame_restore_production.py
      - scripts/postgame_longitudinal.py
      - scripts/postgame_batch.py
      - docs/postgame/input/**
      - tests/test_postgame_quality.py
      - .github/workflows/henachel-postgame-quality.yml
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: henachel-postgame-quality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  postgame-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python offline regression tests
        run: python -m pip install pytest && python -m pytest tests/test_postgame_quality.py tests/test_postgame_oct03_backfill.py tests/test_postgame_restore_production.py -q
      - name: Restore newest verified POINT production ledger
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/henachel-postgame-history
          python scripts/postgame_restore_production_ledger.py \
            --output-dir /tmp/henachel-postgame-history \
            --snapshots docs/postgame/input \
            --status-path docs/postgame/longitudinal/source_ledger_health.json
          python scripts/postgame_import_ledger.py \
            --ledger /tmp/henachel-postgame-history/master_daily_bets_history.csv \
            --output-dir docs/postgame/input
      - name: Audit completed NHL games and update cumulative research reports
        run: |
          python scripts/postgame_batch.py \
            --input-dir docs/postgame/input \
            --results-dir docs/postgame/results \
            --longitudinal-dir docs/postgame/longitudinal
      - name: Upload reproducible research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henachel-postgame-quality-${{ github.run_id }}
          path: |
            docs/postgame/input/*-canonical.csv
            docs/postgame/results/
            docs/postgame/longitudinal/
          if-no-files-found: warn
          retention-days: 90
      - name: Version observed events, without touching models or predictions
        if: success()
        run: |
          git config user.name 'henachel-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/postgame/input/*-canonical.csv docs/postgame/results docs/postgame/longitudinal || true
          if ! git diff --cached --quiet; then
            git commit -m 'research: refresh verified pregame picks and postgame longitudinal evidence'
            git push
          fi
