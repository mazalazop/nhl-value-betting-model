name: Henachel dispatch POINT and GOAL
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/henachel-dispatch.yml
  schedule:
    - cron: '30 10 * * *'
    - cron: '30 11 * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: henachel-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger prediction workflow with POINT and experimental GOAL
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Explicit execution request 2026-10-20; push starts dispatcher.
          python3 - <<'PY'
          import json, os, subprocess, sys
          repo = os.environ["GH_REPO"]
          data = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{repo}/actions/workflows", "--paginate"],
              text=True))
          workflows = data.get("workflows", []) if isinstance(data, dict) else [
              w for page in data for w in page.get("workflows", [])]
          target = ".github/workflows/Workflow global Henachel — POINTS.yml"
          matches = [w for w in workflows if w["path"] == target and w["state"] == "active"]
          if len(matches) != 1:
              sys.exit("Expected exactly one active prediction workflow; no dispatch performed.")
          payload = {"ref": "main", "inputs": {
              "goal_research_enabled": True,
              "publish_to_sheet": False,
              "context_only": False}}
          subprocess.run(
              ["gh", "api", "-X", "POST",
               f"repos/{repo}/actions/workflows/{matches[0]['id']}/dispatches",
               "--input", "-"],
              input=json.dumps(payload), text=True, check=True)
          print("Dispatched POINT + experimental GOAL:", matches[0]["id"])
          PY
