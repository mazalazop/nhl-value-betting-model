name: Henachel live picks Ubuntu

on:
  push:
    branches:
      - season-2026-27-renovation
  workflow_dispatch:
    inputs:
      run_date:
        description: "Date Europe/Paris YYYY-MM-DD"
        required: false
        type: string
      publish_to_sheet:
        description: "Publier vers Google Sheet"
        required: false
        type: boolean
        default: true
      run_points_market:
        description: "Scraper le marché POINTS"
        required: false
        type: boolean
        default: false

concurrency:
  group: henachel-live-picks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Paris
  PYTHONUNBUFFERED: "1"
  HUB_URL: "https://www.unibet.fr/paris-hockey-sur-glace/etats-unis/nhl"

jobs:
  live_picks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve runtime config
        id: config
        shell: bash
        run: |
          RUN_DATE="${{ github.event.inputs.run_date }}"
          if [ -z "$RUN_DATE" ]; then RUN_DATE="$(TZ=Europe/Paris date +%F)"; fi
          PUBLISH="${{ github.event.inputs.publish_to_sheet }}"
          if [ -z "$PUBLISH" ]; then PUBLISH="true"; fi
          RUN_POINTS="${{ github.event.inputs.run_points_market }}"
          if [ -z "$RUN_POINTS" ]; then RUN_POINTS="false"; fi
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "RUN_DATE=$RUN_DATE" >> "$GITHUB_ENV"
          echo "PUBLISH_TO_SHEET=$PUBLISH" >> "$GITHUB_ENV"
          echo "RUN_POINTS_MARKET=$RUN_POINTS" >> "$GITHUB_ENV"

      - name: Checkout model repo
        uses: actions/checkout@v4

      - name: Checkout scraper repo
        uses: actions/checkout@v4
        with:
          repository: mazalazop/nhl-unibet-odds-scraper
          path: scraper_repo
          ref: cec6303ca4d41ffa0265959ea569608c048d04df

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r scraper_repo/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Discover Unibet NHL events
        working-directory: scraper_repo
        env:
          UNIBET_HUB_URL: ${{ env.HUB_URL }}
          PW_HEADLESS: "true"
          DISCOVERY_MAX_MATCHES: "12"
        run: python scrapers/unibet_points_discover_event_urls.py

      - name: Export discovered events
        id: events
        working-directory: scraper_repo
        shell: bash
        run: |
          DISCOVERY_JSON="$(find artifacts/unibet_points_discover_event_urls -name discovered_event_urls.json -print -quit)"
          python - "$DISCOVERY_JSON" <<'PY'
          import json, os, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          data=json.loads(p.read_text())
          urls=data.get("event_urls", [])
          Path(os.environ["GITHUB_ENV"]).open("a").write("UNIBET_EVENT_URLS="+",".join(urls)+"\n")
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(f"has_events={str(bool(urls)).lower()}\n")
          print(f"URLs découvertes: {len(urls)}")
          PY

      - name: Write empty POINTS market
        if: env.RUN_POINTS_MARKET != 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          mkdir -p export_bundle
          printf '%s\n' '{"rows_count":0,"rows":[]}' > export_bundle/normalized_points_odds.json

      - name: Run POINTS batch
        if: env.RUN_POINTS_MARKET == 'true' && steps.events.outputs.has_events == 'true'
        working-directory: scraper_repo
        env:
          UNIBET_EVENT_URLS: ${{ env.UNIBET_EVENT_URLS }}
          PW_HEADLESS: "true"
        run: python scrapers/unibet_event_points_batch_runner.py

      - name: Build POINTS acceptance report
        if: env.RUN_POINTS_MARKET == 'true' && steps.events.outputs.has_events == 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          BATCH="$(ls -td artifacts/unibet_event_points_batch_runner/* | head -n 1)"
          BATCH_SUMMARY_PATH="$BATCH/batch_summary.json" python scrapers/unibet_event_points_acceptance_report.py

      - name: Normalize POINTS
        if: env.RUN_POINTS_MARKET == 'true' && steps.events.outputs.has_events == 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          BATCH="$(ls -td artifacts/unibet_event_points_batch_runner/* | head -n 1)"
          ACCEPTANCE_REPORT_PATH="$BATCH/acceptance_report.json" python scrapers/unibet_event_points_normalize_accepted.py

      - name: Patch live BUTS scraper selector
        working-directory: .
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("scraper_repo/scrapers/unibet_event_goals_parser_v1.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("""TAB_LABEL_CANDIDATES = [
              "Buteurs",
              "Buteur",
              "Buts",
              "Joueurs",
          ]""","""TAB_LABEL_CANDIDATES = [
              "Joueurs",
              "Buteurs",
              "Buteur",
              "Buts",
              "Points",
          ]""")
          s = s.replace("""BLOCK_LABEL_CANDIDATES = [
              "BUTEUR (PROLONGATIONS INCLUSES)",
              "BUTEUR",
          ]""","""BLOCK_LABEL_CANDIDATES = [
              "Nombre de Buts - Joueur - Match",
              "Nombre de Buts - Joueur",
              "NOMBRE DE BUTS - JOUEUR - MATCH",
              "NOMBRE DE BUTS - JOUEUR",
              "NOMBRE DE BUTS DU JOUEUR (PROLONGATIONS INCLUSES)",
              "NOMBRE DE BUTS DU JOUEUR",
              "BUTEUR (PROLONGATIONS INCLUSES)",
              "BUTEUR",
              "Buteur",
          ]""")
          start=s.index("def select_first_matching_market_block(page, labels):")
          end=s.index("\ndef click_all_see_more_in_block",start)
          new_func=r'''def select_first_matching_market_block(page, labels):
              result = page.evaluate(
                  """
                  (cfg) => {
                    const normalize = (value) => String(value || '')
                      .normalize('NFD').replace(/[\\u0300-\\u036f]/g, '')
                      .toLowerCase().replace(/\\s+/g, ' ').trim();
                    const labels=(cfg.labels||[]).map(normalize).filter(Boolean);
                    const teams=(cfg.teams||[]).map(normalize).filter(Boolean);
                    const all=Array.from(document.querySelectorAll('div, section, article, li'));
                    for(const prev of Array.from(document.querySelectorAll('[data-oai-goals-market-target]')))
                      prev.removeAttribute('data-oai-goals-market-target');
                    const candidates=[];
                    for(const el of all){
                      const raw=el.innerText||''; const text=normalize(raw); if(!text) continue;
                      const hasGoals=text.includes('nombre de buts')||text.includes('buteur')||text.includes('2 buts ou plus')||text.includes('1 but ou plus');
                      if(!hasGoals || !text.includes('joueur')) continue;
                      if(text.includes('nombre de points')||text.includes('nombre de passes decisives')||text.includes('points - joueur')) continue;
                      const lines=raw.split(/\\n+/).map(x=>x.trim()).filter(Boolean).length;
                      const odds=(text.match(/\\b\\d+(?:[.,]\\d+)?\\b/g)||[]).length;
                      const more=(text.match(/afficher plus|voir plus/g)||[]).length;
                      const teamHits=teams.filter(x=>x&&text.includes(x)).length;
                      const labelHit=labels.some(lbl=>text.startsWith(lbl)||text.includes(lbl));
                      let score=0;
                      if(labelHit) score+=220;
                      if(text.startsWith('nombre de buts')) score+=180;
                      if(text.startsWith('buteur')) score+=130;
                      if(text.includes('2 buts ou plus')) score+=70;
                      if(text.includes('1 but ou plus')) score+=40;
                      if(teamHits>=1) score+=20;
                      if(odds>=8) score+=25;
                      if(lines>=6&&lines<=180) score+=20;
                      if(more<=8) score+=10;
                      if(text.length>7000) score-=180;
                      if(lines>250) score-=140;
                      candidates.push({el,label:labels.find(lbl=>text.startsWith(lbl)||text.includes(lbl))||'BUTEUR',score,text_length:text.length,line_count:lines,odd_count:odds,show_more_hits:more});
                    }
                    candidates.sort((a,b)=>b.score-a.score||a.text_length-b.text_length||a.line_count-b.line_count);
                    if(!candidates.length) return {found:false,selected_block_label:null};
                    const best=candidates[0];
                    best.el.setAttribute('data-oai-goals-market-target','1');
                    return {found:true,selected_block_label:best.label};
                  }
                  """,
                  {"labels": labels, "teams": teams},
              )
              if not result.get("found"):
                  return None, None
              return "BUTEUR", page.locator('[data-oai-goals-market-target="1"]').first
          '''
          s=s[:start]+new_func+s[end:]
          start=s.index("def parse_goals_rows(lines, teams):")
          end=s.index("\ndef validate_rows",start)
          new_parse=r'''def parse_goals_rows(lines, teams):
              rows=[]; debug_players=[]
          
              team_map={}
              for team in teams:
                  key=normalize_for_match(team); compact=re.sub(r"[^a-z0-9]+","",key)
                  toks=[t for t in key.split() if len(t)>=3]
                  variants={key,compact}
                  if toks: variants.add(toks[-1])
                  for v in variants:
                      if v: team_map[v]=team
          
              def resolve_team(line):
                  key=normalize_for_match(line); compact=re.sub(r"[^a-z0-9]+","",key)
                  if key in team_map: return team_map[key]
                  if compact in team_map: return team_map[compact]
                  for v,team in team_map.items():
                      if len(v)>=5 and (v in compact or compact in v): return team
                  return None
          
              i=0; current_team=None
              headers={"buteur","1 but","1 but ou plus","2 buts ou plus","2 buts"}
              while i<len(lines):
                  line=norm_spaces(lines[i]); resolved=resolve_team(line)
                  if resolved:
                      current_team=resolved; i+=1
                      while i<len(lines) and normalize_for_match(lines[i]) in headers: i+=1
                      continue
                  if not current_team:
                      i+=1; continue
                  player=line
                  if not is_valid_player_name(player,teams):
                      i+=1; continue
                  j=i+1; odds=[]
                  while j<len(lines) and len(odds)<4:
                      token=norm_spaces(lines[j]); key=normalize_for_match(token)
                      if resolve_team(token): break
                      if key in headers or "afficher plus" in key or "voir plus" in key or "voir moins" in key: break
                      if is_decimal_odd(token) or token=="-":
                          odds.append(token); j+=1
                      else: break
                  if odds:
                      first=odds[0]
                      debug_players.append({"team":current_team,"player_name_raw":player,"odds_count_seen":len(odds),"kept_outcome_label":"Buteur","has_dash":any(x=="-" for x in odds),"kept_odds_values":[first] if first!="-" else [],"parser_mode":"line_based_fuzzy_team"})
                      if first!="-":
                          rows.append({"team":current_team,"player_name_raw":player,"outcome_label":"Buteur","odds_raw":first})
                      i=j
                  else:
                      i+=1
              return rows,debug_players
          '''
          s=s[:start]+new_parse+s[end:]
          p.write_text(s,encoding="utf-8")
          print("goal scraper patched")
          
          PY

      - name: Run BUTS batch
        if: steps.events.outputs.has_events == 'true'
        working-directory: scraper_repo
        env:
          UNIBET_EVENT_URLS: ${{ env.UNIBET_EVENT_URLS }}
          PW_HEADLESS: "true"
        run: python scrapers/unibet_event_goals_batch_runner.py

      - name: Build BUTS acceptance report
        if: steps.events.outputs.has_events == 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          BATCH="$(ls -td artifacts/unibet_event_goals_batch_runner/* | head -n 1)"
          BATCH_SUMMARY_PATH="$BATCH/batch_summary.json" python scrapers/unibet_event_goals_acceptance_report.py

      - name: Normalize BUTS
        if: steps.events.outputs.has_events == 'true'
        working-directory: scraper_repo
        shell: bash
        run: |
          BATCH="$(ls -td artifacts/unibet_event_goals_batch_runner/* | head -n 1)"
          ACCEPTANCE_REPORT_PATH="$BATCH/acceptance_report.json" python scrapers/unibet_event_goals_normalize_accepted.py

      - name: Prepare odds bundle
        working-directory: scraper_repo
        shell: bash
        run: |
          mkdir -p export_bundle
          DISC="$(ls -td artifacts/unibet_points_discover_event_urls/* | head -n 1)"
          cp "$DISC/discovered_event_urls.json" export_bundle/discovered_event_urls.json
          if [ -n "$UNIBET_EVENT_URLS" ]; then
            if [ "$RUN_POINTS_MARKET" = "true" ]; then
              P="$(ls -td artifacts/unibet_event_points_batch_runner/* | head -n 1)"
              cp "$P/normalized_points_odds.json" export_bundle/normalized_points_odds.json
            fi
            G="$(ls -td artifacts/unibet_event_goals_batch_runner/* | head -n 1)"
            GN="$(ls -td "$G"/normalized_* | head -n 1)"
            cp "$GN/normalized_goals_odds.json" export_bundle/normalized_goals_odds.json
          else
            printf '%s\n' '{"rows_count":0,"rows":[]}' > export_bundle/normalized_points_odds.json
            printf '%s\n' '{"normalized_rows_count":0,"normalized_rows":[]}' > export_bundle/normalized_goals_odds.json
          fi

      - name: Install Google credentials
        if: steps.config.outputs.publish == 'true'
        shell: bash
        run: |
          mkdir -p secrets
          cat > secrets/henachel-service-account.json <<'JSON'
          ${{ secrets.HENACHEL_GOOGLE_CREDENTIALS_JSON }}
          JSON

      - name: Place odds
        shell: bash
        run: |
          mkdir -p outputs
          cp scraper_repo/export_bundle/normalized_points_odds.json outputs/
          cp scraper_repo/export_bundle/normalized_goals_odds.json outputs/

      - name: Run unit tests
        run: pytest -q tests/test_mobile_payload.py tests/test_selection_engine.py

      - name: Refresh upstream sources
        run: python model/00_refresh_sources.py --min-season 20232024 --skip-boxscore-supplement

      - name: Refresh PP stats
        run: python model/00a_refresh_pp_stats.py

      - name: Build match fusion
        run: python model/00b_build_base_match_fusionnee.py

      - name: Refresh standings
        run: python model/00c_refresh_team_standings.py

      - name: Build features
        run: python model/01_build_base_features.py

      - name: Predict POINTS
        run: python model/05_predict_upcoming_games.py --target-date "${{ env.RUN_DATE }}"

      - name: Match POINTS odds
        run: python model/06_match_model_to_unibet_odds.py --run-date "${{ env.RUN_DATE }}"

      - name: Predict BUTS
        run: python model/05b_predict_upcoming_goals.py --target-date "${{ env.RUN_DATE }}"

      - name: Match BUTS odds
        run: python model/06_match_model_to_unibet_goal_odds.py --run-date "${{ env.RUN_DATE }}"

      - name: Build 5+5 selection
        run: python model/07b_build_combined_daily_bets.py --run-date "${{ env.RUN_DATE }}" --max-points 5 --max-goals 5 --min-edge -1.0

      - name: Build mobile payload
        run: |
          python model/12_build_api_payload.py --input-csv outputs/07_daily_bets.csv --output-json outputs/api/daily_picks.json --slate-date "${{ env.RUN_DATE }}"

      - name: Validate payload
        run: |
          python model/13_validate_daily_payload.py --input-json outputs/api/daily_picks.json --report-json outputs/api/validation.json

      - name: Publish Google Sheet
        if: steps.config.outputs.publish == 'true'
        run: |
          python model/08_publish_to_google_sheet.py --sheet-id "${{ secrets.HENACHEL_SHEET_ID }}" --credentials-json "secrets/henachel-service-account.json"

      - name: Upload live outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: henachel-live-${{ env.RUN_DATE }}
          path: |
            outputs/
            data/raw/
            data/final/
          retention-days: 14
