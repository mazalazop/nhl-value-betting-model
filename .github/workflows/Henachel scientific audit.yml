name: Henachel scientific audit

on:
  push:
    branches:
      - season-2026-27-renovation
  workflow_dispatch:

concurrency:
  group: henachel-scientific-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Europe/Paris
  PYTHONUNBUFFERED: "1"

jobs:
  scientific_audit:
    name: Scientific walk-forward audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout model repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Refresh upstream sources
        run: python model/00_refresh_sources.py

      - name: Refresh PP stats
        run: python model/00a_refresh_pp_stats.py

      - name: Build base match fusionnee
        run: python model/00b_build_base_match_fusionnee.py

      - name: Refresh team standings
        run: python model/00c_refresh_team_standings.py

      - name: Build features
        run: python model/01_build_base_features.py

      - name: Run scientific walk-forward audit
        run: python model/14_walk_forward_audit.py

      - name: Upload audit outputs
        uses: actions/upload-artifact@v4
        with:
          name: henachel-scientific-audit
          path: |
            outputs/walk_forward_audit_metrics.csv
            outputs/walk_forward_audit_predictions.csv
            outputs/walk_forward_audit_summary.json
          if-no-files-found: error
